# Renders key screens to docs/shots/*.png and commits them, so layouts can be
# checked by eye without a device. Run from the Actions tab.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform folders (if not committed yet)
        run: bash scripts/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Render
        run: SHOTS=1 bash scripts/ci_run.sh "Screenshots" flutter test test/screenshots_test.dart --update-goldens
      - name: Commit
        run: |
          git config user.name "little-garage-bot"
          git config user.email "little-garage-bot@users.noreply.github.com"
          git add docs/shots
          git diff --cached --quiet || (git commit -m "Screenshots" && git pull --rebase --autostash -q && git push)
